<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Premium dark developer background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset=".52" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#22d3ee" stop-opacity=".06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>

    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".35" stop-color="#22d3ee" stop-opacity=".65"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".08"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none"
        stroke="#334155" stroke-opacity=".55"/>

  <!-- Ambient UX-style glows -->
  <ellipse cx="170" cy="80" rx="300" ry="210" fill="url(#cyanGlow)" filter="url(#blur)"/>
  <ellipse cx="1040" cy="285" rx="300" ry="230" fill="url(#violetGlow)" filter="url(#blur)"/>

  <!-- Technical grid -->
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="url(#grid)"/>

  <!-- Minimal circuit paths -->
  <g fill="none" stroke="url(#line)" stroke-width="1.5">
    <path d="M0 82H145L188 42H345"/>
    <path d="M1200 92H1050L1004 138H870"/>
    <path d="M0 285H180L218 323H390"/>
    <path d="M1200 265H1070L1030 305H900"/>
    <path d="M690 0V48L735 93V140"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#22d3ee">
    <circle cx="145" cy="82" r="3"/>
    <circle cx="345" cy="42" r="3"/>
    <circle cx="1050" cy="92" r="3"/>
    <circle cx="870" cy="138" r="3"/>
    <circle cx="180" cy="285" r="3"/>
    <circle cx="390" cy="323" r="3"/>
  </g>

  <g fill="#8b5cf6">
    <circle cx="690" cy="48" r="3"/>
    <circle cx="735" cy="93" r="3"/>
    <circle cx="1070" cy="265" r="3"/>
    <circle cx="900" cy="305" r="3"/>
  </g>

  <!-- Fine diagonal accent -->
  <path d="M-30 330L250 50" stroke="#22d3ee" stroke-opacity=".10" stroke-width="1"/>
  <path d="M950 370L1230 90" stroke="#8b5cf6" stroke-opacity=".10" stroke-width="1"/>

  <!-- Small glass-panel accents -->
  <g fill="#0f172a" fill-opacity=".72" stroke="#64748b" stroke-opacity=".18">
    <rect x="48" y="30" width="94" height="34" rx="9"/>
    <rect x="1058" y="30" width="94" height="34" rx="9"/>
  </g>

  <g fill="#94a3b8" fill-opacity=".45">
    <circle cx="67" cy="47" r="3"/>
    <circle cx="81" cy="47" r="3"/>
    <circle cx="95" cy="47" r="3"/>
    <circle cx="1077" cy="47" r="3"/>
    <circle cx="1091" cy="47" r="3"/>
    <circle cx="1105" cy="47" r="3"/>
  </g>

  <!-- Bottom hairline -->
  <path d="M72 338H1128" stroke="url(#line)" stroke-width="1"/>

  <!-- Name -->
  <g text-anchor="middle">
    <text x="600" y="164"
          font-family="Brush Script MT, Segoe Script, cursive"
          font-size="78"
          font-weight="700"
          font-style="italic"
          letter-spacing="1.5"
          fill="#f8fafc"
          stroke="#f8fafc"
          stroke-width="1"
          opacity=".96">HASNAIN HAIDAR</text>
    <!-- subtle ink/paint bleed -->
    <path d="M355 177 C350 194 354 207 351 220
             M520 174 C517 186 521 198 518 208
             M676 176 C673 190 677 203 674 216
             M838 174 C835 187 839 199 836 211"
          fill="none" stroke="#f8fafc" stroke-width="3.5"
          stroke-linecap="round" opacity=".38"/>
  </g>

</svg>